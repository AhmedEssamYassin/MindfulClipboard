<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindfulClipboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-container">
                <span class="search-icon">&#xE71E;</span>
                <input type="text" id="search" placeholder="Search clipboard..." autocomplete="off">
            </div>
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme">&#xE706;</button>
        </div>
        
        <div class="hint">Press Esc to close</div>
        
        <div id="history-list" class="history-list">
            <div class="empty-state">No clipboard history</div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
