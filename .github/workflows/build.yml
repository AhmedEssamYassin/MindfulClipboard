name: Build MindfulClipboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify assets folder
        run: |
          if (Test-Path "assets") {
            Write-Host "[OK] Assets folder found"
            Get-ChildItem -Path assets -Recurse | Select-Object FullName
          } else {
            Write-Host "[ERROR] Assets folder not found!"
            exit 1
          }
        shell: pwsh

      - name: Verify locales folder
        run: |
          if (Test-Path "locales") {
            Write-Host "[OK] Locales folder found"
            Get-ChildItem -Path locales -Recurse | Select-Object FullName
          } else {
            Write-Host "[ERROR] Locales folder not found!"
            exit 1
          }
        shell: pwsh

      - name: Verify web frontend folder
        run: |
          if (Test-Path "src/web") {
            Write-Host "[OK] Web folder found"
            Get-ChildItem -Path src/web -Recurse | Select-Object FullName
          } else {
            Write-Host "[ERROR] Web folder not found!"
            exit 1
          }
        shell: pwsh

      - name: Run PyInstaller build
        run: echo "2" | python build.py
        shell: pwsh

      - name: Verify build output
        run: |
          if (Test-Path "dist/MindfulClipboard/MindfulClipboard.exe") {
            Write-Host "[SUCCESS] Executable built successfully"
            Get-Item dist/MindfulClipboard/MindfulClipboard.exe | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Host "[ERROR] Executable not found!"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindfulClipboard-Windows
          path: dist/MindfulClipboard/
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MindfulClipboard-Windows
          path: ./windows

      - name: Display downloaded files
        run: |
          echo "Windows build:"
          ls -lh ./windows/